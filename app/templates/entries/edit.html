<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaydı Düzenle — MSKÜ Veri Girişi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root { --navy:#1e3d59; --navy-dark:#14293c; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f0f3f7; font-size:14px; color:#111827; }
        .topbar { background:var(--navy); color:#fff; height:56px; display:flex; align-items:center; padding:0 24px; gap:16px; position:sticky; top:0; z-index:100; }
        .topbar-logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; flex-shrink:0; }
        .topbar-logo img { width:32px; height:32px; object-fit:contain; }
        .topbar-logo-text { font-size:13px; font-weight:700; letter-spacing:0.03em; line-height:1.2; }
        .topbar-logo-text small { display:block; font-size:10px; font-weight:400; opacity:0.7; }
        .topbar-nav { display:flex; align-items:center; gap:4px; margin-left:auto; }
        .topbar-nav a { color:rgba(255,255,255,0.85); text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:3px; transition:background 0.15s; white-space:nowrap; }
        .topbar-nav a:hover, .topbar-nav a.active { background:rgba(255,255,255,0.15); color:#fff; }
        .topbar-user { display:flex; align-items:center; gap:10px; margin-left:16px; padding-left:16px; border-left:1px solid rgba(255,255,255,0.2); flex-shrink:0; }
        .topbar-user span { font-size:13px; opacity:0.85; }
        .topbar-user a { color:rgba(255,255,255,0.7); text-decoration:none; font-size:12px; border:1px solid rgba(255,255,255,0.3); padding:4px 10px; border-radius:3px; transition:all 0.15s; }
        .topbar-user a:hover { background:rgba(255,255,255,0.15); color:#fff; }
        .nav-toggle { display:none; background:none; border:1px solid rgba(255,255,255,0.35); color:#fff; border-radius:3px; padding:5px 9px; cursor:pointer; margin-left:auto; font-size:16px; line-height:1; }
        .topbar-nav-user-mobile { display:none; }
        .page-header { background:#fff; border-bottom:1px solid #e5e7eb; padding:20px 24px; }
        .page-header h1 { font-size:20px; font-weight:700; color:var(--navy); margin:0 0 2px; }
        .page-header p { font-size:13px; color:#6b7280; margin:0; }
        .page-body { padding:24px; max-width:720px; }
        .section-card { background:#fff; border:1px solid #e5e7eb; border-radius:4px; overflow:hidden; }
        .section-card-body { padding:24px; }
        .form-label { font-size:12px; font-weight:600; color:#374151; margin-bottom:6px; display:block; }
        .form-control { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:3px; font-size:14px; color:#374151; resize:vertical; min-height:220px; line-height:1.6; }
        .form-control:focus { border-color:var(--navy); box-shadow:0 0 0 3px rgba(30,61,89,0.1); outline:none; }
        .form-hint { font-size:12px; color:#9ca3af; margin-top:6px; }
        .form-actions { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
        .btn-secondary { border:1px solid #d1d5db; padding:8px 16px; text-decoration:none; color:#374151; border-radius:3px; background:#fff; transition:all 0.15s; }
        .btn-secondary:hover { background:#f9fafb; }
        .btn-primary-msku { background:var(--navy); color:#fff; border:none; padding:9px 24px; border-radius:3px; font-size:13px; font-weight:600; cursor:pointer; transition:background 0.15s; }
        .btn-primary-msku:hover { background:var(--navy-dark); }

        @media (max-width:700px) {
            .nav-toggle { display:block; }
            .topbar-nav { display:none; margin-left:0; }
            .topbar-nav.open { display:flex; flex-direction:column; position:absolute; top:56px; left:0; right:0; background:var(--navy-dark); padding:8px 16px 16px; gap:2px; z-index:99; }
            .topbar-nav.open a { padding:10px 12px; }
            .topbar-user { display:none; }
            .topbar { flex-wrap:wrap; height:auto; min-height:56px; padding:0 16px; position:relative; }
            .page-body { padding:16px; }
            .page-header { padding:16px; }
            .form-actions { flex-direction:column; gap:10px; }
            .btn-secondary, .btn-primary-msku { width:100%; text-align:center; }
            .form-control { min-height:180px; }

            .topbar-nav-user-mobile { display:flex; flex-direction:column; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.15); }
            .topbar-nav-user-mobile span { color:rgba(255,255,255,0.6); font-size:12px; padding:4px 12px; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <a href="/kayitlar" class="topbar-logo">
        <img src="{{ url_for('static', path='/mskü.amblem.png') }}" alt="MSKÜ">
        <div class="topbar-logo-text">MSKÜ Chatbot<small>Veri Giriş Sistemi</small></div>
    </a>
    <button class="nav-toggle" onclick="toggleNav()">&#9776;</button>
    <nav class="topbar-nav" id="topbarNav">
        <a href="/kayitlar/yeni">Yeni Kayıt</a>
        <a href="/kayitlar" class="active">Kayıtlarım</a>
        <div class="topbar-nav-user-mobile">
            <span>Personel</span>
            <a href="/logout">Çıkış Yap</a>
        </div>
    </nav>
    <div class="topbar-user">
        <span>Personel</span>
        <a href="/logout">Çıkış Yap</a>
    </div>
</header>

<div class="page-header">
    <h1>Kaydı Düzenle</h1>
    <p>İçerik güncellendiğinde AI yeniden analiz eder.</p>
</div>

<div class="page-body">
    <div class="section-card">
        <div class="section-card-body">
            <form action="/kayitlar/{{ entry.id }}/duzenle" method="POST">
                <label class="form-label">İçerik</label>

                <textarea name="content" class="form-control" rows="10" required>{{ entry.content }}</textarea>

                <p class="form-hint">
                    Güncelleme sonrası AI yeniden sınıflandırma yapar.
                </p>

                <div class="form-actions">
                    <a href="/kayitlar" class="btn-secondary">İptal</a>
                    <button type="submit" class="btn-primary-msku">Güncelle</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function toggleNav() { document.getElementById('topbarNav').classList.toggle('open'); }
</script>
</body>
</html>
