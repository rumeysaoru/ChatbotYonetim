<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş — MSKÜ Chatbot Sistemi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root {
            --navy: #1e3d59;
            --navy-dark: #14293c;
            --navy-light: #e8edf2;
            --accent: #c8972a;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f3f7;
        }
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-box {
          background: #fff;
          border-radius: 4px;
          box-shadow: 0 4px 24px rgba(30,61,89,0.13);
          width: 100%;
          max-width: 480px;
          padding: 40px 36px 36px;
}
        .login-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .login-logo img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }
        .login-logo-text {
            line-height: 1.2;
        }
        .login-logo-text strong {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .login-logo-text span {
            font-size: 11px;
            color: #6b7280;
        }
        .login-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
            display: block;
        }
        .form-control {
            border: 1px solid #d1d5db;
            border-radius: 3px;
            font-size: 14px;
            padding: 9px 12px;
            color: #111827;
            transition: border-color 0.15s;
        }
        .form-control:focus {
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(30,61,89,0.1);
            outline: none;
        }
        .btn-login {
            background-color: var(--navy);
            color: #fff;
            border: none;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 600;
            padding: 10px;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .btn-login:hover { background-color: var(--navy-dark); }
        .error-box {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 3px;
            color: #b91c1c;
            font-size: 13px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }
        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-box">
        <div class="login-logo">
            <img src="{{ url_for('static', path='/msku-logo.png') }}" alt="MSKÜ">
            <div class="login-logo-text">
                <strong>Muğla Sıtkı Koçman Üniversitesi</strong>
                <span>Chatbot Veri Yönetim Sistemi</span>
            </div>
        </div>

        <div class="login-title">Sisteme Giriş</div>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <div class="mb-3">
                <label for="username">E-posta</label>
                <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="mb-4">
                <label for="password">Şifre</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">Giriş Yap</button>
        </form>

        <div class="login-footer">MSKÜ Bilgi İşlem Daire Başkanlığı</div>
    </div>
</div>
</body>
</html>
